<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omarchy Orb · 调参台（v3 设计令牌）</title>
<style id="tokvars"></style>
<style>
/* ============ 调参台外框（不受令牌影响） ============ */
:root{--sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",monospace;--ease:cubic-bezier(.2,.8,.2,1);--side:348px;--z:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e7e8ec;color:#1d2130;font:13px/1.45 var(--sans)}
#side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:#fff;border-right:1px solid #d9dbe3;display:flex;flex-direction:column;z-index:10}
#side header{padding:14px 16px 10px;border-bottom:1px solid #eceef3}
#side header h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em}
#side header p{margin:2px 0 0;color:#6b7084;font-size:12px}
#sideBody{flex:1;overflow:auto;padding:4px 16px 16px}
.sec{margin-top:14px}
.sec h2{font-size:12px;font-weight:700;color:#4a5068;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.04em}
.sec h2 small{font-weight:400;color:#8b90a3;letter-spacing:0}
table.colors{width:100%;border-collapse:collapse}
table.colors th{font-size:11px;color:#8b90a3;font-weight:600;text-align:left;padding:0 0 4px}
table.colors td{padding:2px 0;vertical-align:middle}
table.colors td.lab{font-size:12px;color:#30354a;white-space:nowrap;padding-right:6px}
table.colors td.lab code{font:10.5px var(--mono);color:#9a9fb2;margin-left:3px}
.cc{display:flex;align-items:center;gap:4px}
.cc input[type=color]{width:26px;height:24px;padding:0;border:1px solid #d3d6df;border-radius:6px;background:none;cursor:pointer;flex:none}
.cc input[type=color]::-webkit-color-swatch-wrapper{padding:2px}.cc input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
.cc input[type=text]{width:66px;height:24px;border:1px solid #d3d6df;border-radius:6px;font:11px var(--mono);padding:0 5px;color:#30354a}
.cc input[type=text].bad{border-color:#d33;background:#fff3f3}
.sz{display:grid;grid-template-columns:1fr 58px;gap:2px 8px;align-items:center;margin-bottom:9px}
.sz label{font-size:12px;color:#30354a}
.sz label small{color:#9a9fb2;font-size:11px;margin-left:4px}
.lock{display:inline-block;color:#b5571b;background:#fdf0e6;border:1px solid #f1d2bb;border-radius:4px;font-size:10.5px;line-height:15px;padding:0 4px;margin-left:5px;font-weight:600}
.sz input[type=number]{width:58px;height:24px;border:1px solid #d3d6df;border-radius:6px;font:12px var(--mono);padding:0 4px;text-align:right}
.sz input[type=range]{grid-column:1/3;width:100%;margin:0;accent-color:#3d6fe0}
.sim-opt{display:flex;align-items:center;gap:8px;font-size:12px;color:#30354a}
.sim-opt select{flex:1;height:28px;border:1px solid #d3d6df;border-radius:6px;font:12px var(--sans);background:#fff}
#sideFoot{border-top:1px solid #eceef3;padding:10px 16px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tb{height:30px;border:1px solid #d3d6df;background:#f6f7fa;border-radius:7px;font:12px var(--sans);color:#262b3d;cursor:pointer;padding:0 10px;white-space:nowrap}
.tb:hover{background:#eceef4}
.tb.pri{background:#3d6fe0;border-color:#3d6fe0;color:#fff}.tb.pri:hover{background:#3360c9}
.tb.warn{color:#b0402a}
#saveState{grid-column:1/3;font-size:11px;color:#8b90a3;min-height:15px}
#main{position:fixed;left:var(--side);right:0;top:0;bottom:0;display:flex;flex-direction:column}
#bar{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:#f8f9fb;border-bottom:1px solid #d9dbe3}
#bar b{font-size:13px;margin-right:6px}
#bar input[type=range]{width:180px;accent-color:#3d6fe0}
#zv{font:12px var(--mono);width:44px;color:#4a5068}
#bar .sp{flex:1}
#bar .hint{font-size:11.5px;color:#8b90a3}
#vp{flex:1;overflow:auto;position:relative;background:#e7e8ec}
#sizer{position:relative}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0;padding:28px;display:flex;flex-direction:column;gap:28px;width:max-content}
#logwrap{flex:none;height:132px;border-top:1px solid #d9dbe3;background:#fbfbfd;display:flex;flex-direction:column}
#logwrap.min{height:30px}
#loghead{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:12px;color:#4a5068;border-bottom:1px solid #eceef3}
#loghead button{height:22px;font-size:11px;padding:0 8px}
#log{margin:0;padding:4px 12px;font:11px/1.5 var(--mono);overflow:auto;flex:1;white-space:pre-wrap;word-break:break-all;color:#30354a}
#log .tx{color:#2f62d0}#log .rx{color:#3b7d2a}#log .loc{color:#8b90a3}#log .ws{color:#8a4fd6}#log .err{color:#c33}
#log i{font-style:normal;color:#b0782a}
/* 画布：主题分区 */
.band{background:var(--bg);border-radius:28px;padding:30px 36px 36px;box-shadow:0 1px 0 #0001,0 6px 24px #0000000f}
.band>h2{margin:0 0 6px;color:var(--fg);font:700 min(calc(20px / var(--z)),44px)/1.2 var(--sans)}
.row{display:flex;gap:44px;align-items:flex-start;margin-top:26px}
.rowlab{flex:none;width:min(calc(16px / var(--z)),36px);writing-mode:vertical-rl;color:var(--sub);font:600 min(calc(13px / var(--z)),30px)/1 var(--sans);letter-spacing:.1em;align-self:center;white-space:nowrap}
.board{margin:0;flex:none;display:flex;flex-direction:column;gap:12px}
.bh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;font:600 min(calc(13px / var(--z)),26px)/1.25 var(--sans);color:var(--fg);background:var(--panel);border:1px solid var(--pline);border-radius:12px;padding:.35em .6em}
.bh{flex-wrap:nowrap}.bh .bt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.bh .bc{flex:none}
.bh .bc{display:flex;gap:.4em;align-items:center}
.bh select,.bh button{font:400 .8em var(--sans);height:1.7em;border-radius:.35em;border:1px solid var(--line);background:var(--btn);color:var(--fg);cursor:pointer;padding:0 .4em}
.devhost{position:relative;flex:none}
/* 弹窗 */
#modal{position:fixed;inset:0;background:#10131c88;display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .box{width:min(720px,92vw);background:#fff;border-radius:14px;padding:16px 18px;box-shadow:0 20px 60px #0005;display:flex;flex-direction:column;gap:10px}
#modal h3{margin:0;font-size:15px}
#modal p{margin:0;font-size:12px;color:#6b7084}
#modal textarea{width:100%;height:52vh;font:12px/1.5 var(--mono);border:1px solid #d3d6df;border-radius:8px;padding:10px;resize:vertical;color:#262b3d}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;align-items:center}
#modal .acts .msg{flex:1;font-size:12px;color:#3b7d2a}
#modal .acts .msg.err{color:#c33}

/* ============ 设备实例（全部使用令牌变量） ============ */
.inst{font-family:var(--sans);color:var(--fg);line-height:1.3}
.inst button{font-family:inherit;color:inherit;padding:0}
.inst .screen{position:relative;overflow:hidden;background:var(--scr);color:var(--fg);touch-action:none;user-select:none;-webkit-user-select:none}
.inst .toast{position:absolute;left:50%;transform:translate(-50%,0) scale(.9);opacity:0;pointer-events:none;background:color-mix(in srgb,var(--scr) 30%,#000 70%);color:#fff;border:2px solid var(--acc);border-radius:999px;padding:10px 22px;font-size:var(--fs-title);font-weight:600;white-space:nowrap;transition:opacity .15s,transform .15s var(--ease);z-index:20}
.inst .toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.inst .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:2px 12px;font-size:var(--fs-body);white-space:nowrap}
.inst .chip .ic{width:calc(var(--fs-body) * 1.1);height:calc(var(--fs-body) * 1.1)}
.inst .btn{background:var(--btn);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--sp) * 1.5);cursor:pointer}
.inst .btn:active,.inst .btn.press{border-color:var(--acc);transform:scale(.97)}
.inst .btn.pri{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.inst .ic{width:var(--ic);height:var(--ic);fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.inst .ic .f{fill:currentColor;stroke:none}
.inst .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inst .bar{height:var(--bar);border-radius:calc(var(--bar) / 2);background:var(--trk);position:relative;overflow:hidden}
.inst .bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:calc(var(--bar) / 2)}
.inst .bar>i.ghost{background:var(--acc2);opacity:.55}
.inst .wave{display:flex;gap:5px;align-items:center;justify-content:center;height:56px}
.inst .wave i{width:6px;border-radius:3px;background:var(--bad);transition:height .1s linear}
.inst .tier{display:inline-block;border-radius:calc(var(--r) * .45);padding:2px 10px;font-size:var(--fs-body);font-weight:600}
.inst .tier.t1{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.inst .tier.t2{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.inst .tier.t3{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.inst .cover{border-radius:calc(var(--r) + 2px);display:flex;align-items:center;justify-content:center;color:#fff8;box-shadow:0 18px 40px #0005;flex:none}
.inst .cover .ic{width:calc(var(--ic) * 2);height:calc(var(--ic) * 2)}
/* 手机 390×844 */
.inst .phone{width:414px;height:868px;border-radius:56px;background:var(--frame);padding:12px;box-shadow:0 0 0 1px #0006,0 24px 60px var(--shadow)}
.inst .phone .screen{width:390px;height:844px;border-radius:44px;display:flex;flex-direction:column}
.inst .ph-status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0;font-size:14px;font-weight:600}
.inst .ph-status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.inst .ph-island{position:absolute;left:50%;top:10px;width:110px;height:30px;margin-left:-55px;background:#000;border-radius:16px}
.inst .ph-mod{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.inst .ph-tabs{flex:none;display:flex;border-top:1px solid var(--line);padding:0 8px 22px;background:color-mix(in srgb,var(--scr) 85%,var(--btn))}
.inst .ph-tabs button{flex:1;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-body);color:var(--mut);cursor:pointer;min-height:var(--touch);white-space:nowrap}
.inst .ph-tabs button[aria-current="true"]{color:var(--acc)}
.inst .ph-home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg);opacity:.5}
.inst .ph-toast{top:150px}
.inst .p-h{font-size:var(--fs-title);font-weight:700;margin:calc(var(--sp) * 1.5) calc(var(--sp) * 5) calc(var(--sp) * 3);flex:none}
.inst .np-pad{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--sp) * 2);cursor:grab;padding:calc(var(--fs-body) * 1.9) 0 calc(var(--fs-body) * 2.9)}
.inst .np-pad .cover{width:236px;height:236px}
.inst .np-pad .chip{position:absolute;left:calc(var(--sp) * 5);top:8px}
.inst .np-pad .hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:var(--fs-body);line-height:1.3;color:var(--mut);padding:0 calc(var(--sp) * 5);pointer-events:none}
.inst .np-pad .scrub{font-size:var(--fs-big);font-weight:700;color:var(--acc2);height:calc(var(--fs-big) * 1.2);line-height:1.2;flex:none}
.inst .np-info{flex:none;padding:0 calc(var(--sp) * 6) calc(var(--sp) * 4);display:flex;flex-direction:column;gap:calc(var(--sp) * 2)}
.inst .np-title{font-size:var(--fs-title);font-weight:700}
.inst .np-artist{font-size:var(--fs-body);color:var(--sub);margin-top:calc(var(--sp) * -1.5)}
.inst .np-time{display:flex;justify-content:space-between;font:var(--fs-body) var(--mono);color:var(--sub);margin-top:4px}
.inst .np-vol{display:flex;align-items:center;gap:calc(var(--sp) * 2.5);font-size:var(--fs-body);color:var(--sub)}
.inst .np-vol .bar{flex:1}
.inst .np-vol span{width:3em;text-align:right}
.inst .np-ctl{display:flex;justify-content:center;align-items:center;gap:max(0px,min(calc(var(--sp) * 5),calc((342px - var(--touch) * 2 - var(--btn-pri)) / 2)));margin-top:2px}
.inst .np-ctl .btn{flex:none;width:var(--touch);height:var(--touch);border-radius:50%;gap:0}
.inst .np-ctl .btn small{font-size:var(--fs-body);line-height:1}
.inst .np-ctl .btn.pri{width:var(--btn-pri);height:var(--btn-pri)}
.inst .np-ctl .btn.pri .ic{width:calc(var(--ic) * 1.4);height:calc(var(--ic) * 1.4)}
.inst .np-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--sp) * 4);padding:0 calc(var(--sp) * 7)}
.inst .np-empty p{margin:0 0 8px;color:var(--sub);font-size:var(--fs-body)}
.inst .np-empty .btn{width:100%;height:var(--touch);flex-direction:row;gap:14px;font-size:var(--fs-title);font-weight:600}
.inst .ws-cur{margin:0 calc(var(--sp) * 5) calc(var(--sp) * 4);padding:calc(var(--sp) * 3.5) calc(var(--sp) * 4);border:1px solid var(--line);border-radius:calc(var(--r) - 2px);background:var(--btn);flex:none}
.inst .ws-cur small{display:block;color:var(--mut);font-size:var(--fs-body);margin-bottom:4px}
.inst .ws-cur b{display:block;font-size:var(--fs-body)}
.inst .ws-cur span{font-size:var(--fs-body);color:var(--sub)}
.inst .ws-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--sp) * 3);padding:0 calc(var(--sp) * 5)}
.inst .ws-grid .btn{height:calc(var(--touch) + 16px);font-size:var(--fs-big);font-weight:700;line-height:1;gap:calc(var(--sp) * 1)}
.inst .ws-grid .btn small{font-size:var(--fs-body);font-weight:400;color:var(--sub)}
.inst .ws-grid .btn.pri small{color:var(--on-acc)}
.inst .qk-grid{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--sp) * 3.5);padding:calc(var(--sp) * 2) calc(var(--sp) * 5)}
.inst .qk-grid .btn{height:max(170px,var(--touch));font-size:var(--fs-body);font-weight:600}
.inst .qk-grid .ic{width:calc(var(--ic) * 1.57);height:calc(var(--ic) * 1.57)}
.inst .qk-foot{margin:calc(var(--sp) * 4) calc(var(--sp) * 5);font-size:var(--fs-body);color:var(--sub)}
.inst .pt-card{margin:0 calc(var(--sp) * 5);min-height:190px;border:1px solid var(--line);border-radius:var(--r);background:var(--btn);padding:calc(var(--sp) * 4);display:flex;flex-direction:column;gap:calc(var(--sp) * 2.5);flex:none}
.inst .pt-card .q{font-size:var(--fs-title);font-weight:600}
.inst .pt-card .r{font-size:var(--fs-body);color:var(--sub)}
.inst .pt-card .ph{color:var(--mut);font-size:var(--fs-body)}
.inst .pt-hold{position:absolute;left:50%;bottom:28px;width:calc(var(--btn-pri) * 1.5);height:calc(var(--btn-pri) * 1.5);transform:translateX(-50%);border-radius:50%;font-size:var(--fs-title);font-weight:700}
.inst .pt-hold:active,.inst .pt-hold.press{transform:translateX(-50%) scale(.97)}
.inst .pt-hold .ic{width:calc(var(--ic) * 1.7);height:calc(var(--ic) * 1.7)}
.inst .pt-hold.rec{background:var(--bad);border-color:var(--bad);color:#fff;transform:translateX(-50%) scale(1.06)}
.inst .nw{white-space:nowrap}
.inst .pt-tiers{margin:calc(var(--sp) * 3.5) calc(var(--sp) * 5) 0;font-size:var(--fs-body);color:var(--sub);line-height:1.75}
/* 圆屏 466×466 */
.inst .orb{width:520px;display:flex;flex-direction:column;align-items:center;gap:14px}
.inst .orb-ring{width:490px;height:490px;border-radius:50%;background:var(--frame);padding:12px;box-shadow:0 0 0 1px #0006,0 24px 60px var(--shadow)}
.inst .orb .screen{width:466px;height:466px;border-radius:50%;background:var(--orbScr)}
.inst .orb-mod{position:absolute;inset:0}
.inst .orb-toast{top:206px}
.inst .orb-dots{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:10px;pointer-events:none}
.inst .orb-dots i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.inst .orb-dots i.on{background:var(--acc);width:22px;border-radius:4px}
.inst .hw{display:flex;gap:12px}
.inst .hw button{min-height:48px;padding:0 16px;border-radius:12px;background:var(--btn);border:1px solid var(--line);font-size:14px;cursor:pointer}
.inst .hw button.rec{background:var(--bad);color:#fff}
.inst .o-abs{position:absolute;left:0;right:0;text-align:center}
.inst .o-t{font-size:var(--fs-title);font-weight:700}.inst .o-s{font-size:var(--fs-body);color:var(--sub)}
.inst .o-pad{position:absolute;inset:0;border-radius:50%;cursor:grab}
.inst .o-grid{position:absolute;display:grid}
.inst .o-grid .btn{font-weight:700;line-height:1}
.inst .o-grid .btn small{font-size:var(--fs-body);font-weight:600}
.inst .o-grid .btn .ic{width:calc(var(--ic) * 1.43);height:calc(var(--ic) * 1.43)}
.inst .o-hold .ic{width:calc(var(--ic) * 1.7);height:calc(var(--ic) * 1.7)}
.inst svg.o-ring{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>
<aside id="side" aria-label="设计令牌">
  <header><h1>Omarchy Orb · 调参台</h1><p>v3 设计令牌 · 改一处，所有实例实时跟随 · 尺寸以 466 逻辑像素为基准</p></header>
  <div id="sideBody">
    <div class="sec"><h2>颜色 <small>深色 = Tokyo Night</small></h2><table class="colors" id="colorTbl"></table></div>
    <div class="sec"><h2>尺寸 <small><span class="lock" style="margin:0">锁</span> = 硬下限，滑块最小值即下限</small></h2><div id="sizeBox"></div></div>
    <div class="sec"><h2>交互模拟</h2>
      <div class="sim-opt">PTT 识别结果<select id="pttPick"></select></div>
    </div>
  </div>
  <div id="sideFoot">
    <button class="tb pri" id="bSave">保存（显示 JSON）</button>
    <button class="tb" id="bExport">导出 tokens.json</button>
    <button class="tb" id="bCopy">复制 JSON</button>
    <button class="tb" id="bImport">从 JSON 导入</button>
    <button class="tb warn" id="bReset" style="grid-column:1/3">重置为 v3 默认</button>
    <div id="saveState"></div>
  </div>
</aside>
<main id="main">
  <div id="bar">
    <b>画布</b>缩放<input type="range" id="zoom" min="15" max="150" step="1" value="40"><span id="zv">40%</span>
    <button class="tb" id="bFitW">适应宽度</button><button class="tb" id="bFitAll">全部可见</button><button class="tb" id="bZ100">100%</button>
    <span class="sp"></span><span class="hint">每张画板都是独立实例，可点、可滑（手势同 v3）· Ctrl+滚轮缩放</span>
  </div>
  <div id="vp"><div id="sizer"><div id="canvas"></div></div></div>
  <div id="logwrap"><div id="loghead"><span>交互日志（各实例发往 mock daemon 的命令）</span><span><button class="tb" id="bClearLog">清空</button> <button class="tb" id="bMinLog">收起</button></span></div><pre id="log" aria-live="polite"></pre></div>
</main>
<div id="modal" role="dialog" aria-modal="true"><div class="box"><h3 id="mTitle"></h3><p id="mDesc"></p><textarea id="mText" spellcheck="false"></textarea><div class="acts"><span class="msg" id="mMsg"></span><button class="tb" id="mCopy">复制</button><button class="tb pri" id="mApply">应用导入</button><button class="tb" id="mClose">关闭</button></div></div></div>
<script>
(() => {
"use strict";
/* =====================================================================
   令牌：v3 默认值 + 下限/上限

function mountBoard(b) {
  if (b.inst) b.inst.destroy();
  b.inst = createSim(b.host, { shell: b.shell, mod: b.cfg.mod, player: b.player || b.cfg.player, state: b.cfg.state, theme: b.theme, tag: b.tag,
    log: logLine, scale: () => Z, pttPick: () => $("pttPick").value });
}
function buildCanvas() {
  canvas.innerHTML = THEMES.map(([th, name]) => `<section class="band" data-theme="${th}"><h2>${name}</h2>
    ${[["phone", "手机 PWA · 390×844", PHONE_BOARDS], ["orb", "圆屏 ESP32 · 466×466", ORB_BOARDS]].map(([sh, lab, list]) => `<div class="row"><div class="rowlab">${lab}</div>
      ${list.map((c, i) => { const id = `${th}-${sh}-${i}`; return `<figure class="board" data-board="${id}" style="width:${DIM[sh][0]}px">
        <figcaption class="bh"><span class="bt">${sh === "phone" ? "手机" : "圆屏"}｜${c.title}</span><span class="bc">
        ${c.pick ? `<select data-player title="模拟 X1 上的播放器"><option value="music">音乐</option><option value="podcast">播客</option><option value="video">视频</option><option value="none">无</option></select>` : ""}
        <button data-reset title="复位此画板（重建实例）" aria-label="复位">↺</button></span></figcaption>
        <div class="devhost" style="width:${DIM[sh][0]}px;height:${DIM[sh][1]}px"></div></figure>`; }).join("")}</div>`).join("")}</section>`).join("");
  canvas.querySelectorAll(".board").forEach((el) => {
    const [th, sh, i] = el.dataset.board.split("-"), cfg = (sh === "phone" ? PHONE_BOARDS : ORB_BOARDS)[+i];
    const b = { id: el.dataset.board, el, host: el.querySelector(".devhost"), cfg, theme: th, shell: sh, player: cfg.player,
      tag: `${th === "tokyo" ? "深" : "浅"}·${sh === "phone" ? "手机" : "圆屏"}·${cfg.title}` };
    boards.push(b); mountBoard(b);
    el.querySelector("[data-reset]").onclick = () => { b.player = cfg.player; const s = el.querySelector("[data-player]"); if (s) s.value = cfg.player; mountBoard(b); };
    const s = el.querySelector("[data-player]"); if (s) s.onchange = () => { b.player = s.value; b.inst.setPlayer(s.value); };
  });
}

/* ---------- 缩放 ---------- */
const vp = $("vp"), sizer = $("sizer");
function setZoom(z, anchor) {
  z = clamp(Math.round(z * 100) / 100, 0.15, 1.5);
  const oldZ = Z, ax = anchor ? anchor[0] : vp.clientWidth / 2, ay = anchor ? anchor[1] : 0;
  const cx = (vp.scrollLeft + ax) / oldZ, cy = (vp.scrollTop + ay) / oldZ;
  Z = z; document.documentElement.style.setProperty("--z", z);
  canvas.style.transform = `scale(${z})`;
  sizer.style.width = canvas.offsetWidth * z + "px"; sizer.style.height = canvas.offsetHeight * z + "px";
  $("zoom").value = Math.round(z * 100); $("zv").textContent = Math.round(z * 100) + "%";
  if (anchor) { vp.scrollLeft = cx * z - ax; vp.scrollTop = cy * z - ay; }
}
function fit(all) {
  for (let k = 0; k < 3; k++) { // 标题字号随缩放变化 → 迭代几次求稳定
    const zw = (vp.clientWidth - 8) / canvas.offsetWidth, zh = (vp.clientHeight - 8) / canvas.offsetHeight;
    setZoom(all ? Math.min(zw, zh) : zw);
  }
  vp.scrollLeft = 0; vp.scrollTop = 0;
}
$("zoom").oninput = (e) => setZoom(+e.target.value / 100);
$("bFitW").onclick = () => fit(false); $("bFitAll").onclick = () => fit(true); $("bZ100").onclick = () => setZoom(1);
vp.addEventListener("wheel", (e) => { if (!e.ctrlKey) return; e.preventDefault(); const r = vp.getBoundingClientRect(); setZoom(Z * (e.deltaY < 0 ? 1.1 : 1 / 1.1), [e.clientX - r.left, e.clientY - r.top]); }, { passive: false });
window.addEventListener("resize", () => setZoom(Z));

/* =====================================================================
   令牌 → CSS 变量 / 侧栏
   ===================================================================== */
const HEX = /^#[0-9a-fA-F]{6}$/;
function normalize(src) {
  const out = DEFAULTS(), notes = [];
  const th = src && isObj(src.themes) ? src.themes : {};
  for (const t of Object.keys(out.themes)) for (const [k] of COLOR_KEYS) {
    const v = th[t] && th[t][k]; if (v == null) continue;
    if (typeof v === "string" && HEX.test(v.trim())) out.themes[t][k] = v.trim().toLowerCase(); else notes.push(`${t}.${k} 非法颜色，已用默认`);
  }
  const sz = src && isObj(src.size) ? src.size : {};
  for (const [k, , , min, max] of SIZE_DEF) {
    if (sz[k] == null) continue; const n = Number(sz[k]);
    if (!isFinite(n)) { notes.push(`${k} 不是数字，已用默认`); continue; }
    const c = clamp(Math.round(n), min, max); if (c !== n) notes.push(`${k}=${sz[k]} 超出 ${min}–${max}，已夹到 ${c}`); out.size[k] = c;
  }
  if (out.size.btnPri < out.size.touch) { notes.push(`主按钮 ${out.size.btnPri} < 触控区，已提升到 ${out.size.touch}`); out.size.btnPri = out.size.touch; }
  return { tok: out, notes };
}
function exportObj() {
  return { name: "omarchy-orb-tokens", version: 1, source: "Omarchy Orb v3 调参台", unit: "px（以 466×466 逻辑像素为基准）", savedAt: new Date().toISOString(),
    themes: TOK.themes, size: TOK.size,
    limits: Object.fromEntries(SIZE_DEF.map(([k, , , min, max, hard]) => [k, { min, max, hardFloor: hard }])) };
}
function applyVars() {
  let css = "";
  for (const t of Object.keys(TOK.themes)) css += `[data-theme="${t}"]{${Object.entries(TOK.themes[t]).map(([k, v]) => `--${k}:${v}`).join(";")};--shadow:${SHADOW[t]}}\n`;
  const s = TOK.size;
  css += `:root{--r:${s.radius}px;--sp:${s.space}px;--fs-body:${s.fsBody}px;--fs-title:${s.fsTitle}px;--fs-big:${s.fsBig}px;--btn-pri:${s.btnPri}px;--touch:${s.touch}px;--ic:${s.icon}px;--bar:${s.barPhone}px;--ring:${s.ringOrb}px}`;
  $("tokvars").textContent = css;
  Object.assign(T, s);
}
let saveT = 0;
function persist() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(LS_KEY, J(exportObj())); $("saveState").textContent = `已自动保存到本机 · ${new Date().toTimeString().slice(0, 8)}`; } catch (e) { $("saveState").textContent = "本机自动保存不可用（浏览器限制）"; } }, 250);
}
function onTokens(sizeChanged) {
  applyVars(); persist();
  if (sizeChanged) { boards.forEach((b) => b.inst && b.inst.render()); requestAnimationFrame(() => setZoom(Z)); }
}
function buildSide() {
  $("colorTbl").innerHTML = `<tr><th>令牌</th><th>深色</th><th>浅色</th></tr>` + COLOR_KEYS.map(([k, lab]) => `<tr><td class="lab">${lab}<code>${k}</code></td>
    ${["tokyo", "light"].map((t) => `<td><div class="cc"><input type="color" data-t="${t}" data-k="${k}" aria-label="${lab} ${t}"><input type="text" data-t="${t}" data-k="${k}" maxlength="7" aria-label="${lab} ${t} 十六进制"></div></td>`).join("")}</tr>`).join("");
  $("sizeBox").innerHTML = SIZE_DEF.map(([k, lab, def, min, max, hard, note]) => `<div class="sz" title="${esc(note)}"><label for="n-${k}">${lab}${hard ? `<span class="lock">锁 ≥${min}</span>` : ""}<small>默认 ${def}</small></label>
    <input type="number" id="n-${k}" data-s="${k}" min="${min}" max="${max}" step="1"><input type="range" data-s="${k}" min="${min}" max="${max}" step="1" aria-label="${lab}"></div>`).join("");
  $("colorTbl").addEventListener("input", (e) => {
    const el = e.target, t = el.dataset.t, k = el.dataset.k; if (!t) return;
    let v = el.value.trim(); if (el.type === "text") { if (!v.startsWith("#")) v = "#" + v; if (!HEX.test(v)) { el.classList.add("bad"); return; } el.classList.remove("bad"); }
    TOK.themes[t][k] = v.toLowerCase(); syncSide(); onTokens(false);
  });
  $("sizeBox").addEventListener("input", (e) => {
    const el = e.target, k = el.dataset.s; if (!k) return;
    const d = SIZE_DEF.find((x) => x[0] === k); let n = Number(el.value);
    if (el.type === "number" && (el.value === "" || !isFinite(n))) return;
    if (el.type === "number" && (n < d[3] || n > d[4])) return; // 输入中途不打断；失焦时夹紧
    TOK.size[k] = Math.round(n);
    if (k === "touch" && TOK.size.btnPri < TOK.size.touch) TOK.size.btnPri = TOK.size.touch;
    if (k === "btnPri" && TOK.size.btnPri < TOK.size.touch) TOK.size.btnPri = TOK.size.touch;
    syncSide(el); onTokens(true);
  });
  $("sizeBox").addEventListener("change", (e) => { const el = e.target, k = el.dataset.s; if (!k || el.type !== "number") return; const d = SIZE_DEF.find((x) => x[0] === k); TOK.size[k] = clamp(Math.round(Number(el.value) || d[2]), d[3], d[4]); if (TOK.size.btnPri < TOK.size.touch) TOK.size.btnPri = TOK.size.touch; syncSide(); onTokens(true); });
  $("pttPick").innerHTML = `<option value="__cycle">轮换示例句</option>` + PTT_SAMPLES.map((s) => `<option>${esc(s)}</option>`).join("");
}
function syncSide(except) {
  document.querySelectorAll("#colorTbl input").forEach((el) => { if (el === document.activeElement && el.type === "text") return; el.value = TOK.themes[el.dataset.t][el.dataset.k]; el.classList.remove("bad"); });
  document.querySelectorAll("#sizeBox input").forEach((el) => { if (el !== except) el.value = TOK.size[el.dataset.s]; });
}

/* ---------- 操作：保存 / 导出 / 复制 / 导入 / 重置 ---------- */
const pretty = () => JSON.stringify(exportObj(), null, 2);
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;left:-9999px"; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (x) { ok = false; } ta.remove(); return ok;
  }
}
const flash = (t) => { $("saveState").textContent = t; };
function openModal(mode) {
  const imp = mode === "import";
  $("mTitle").textContent = imp ? "从 JSON 导入令牌" : "当前令牌 JSON";
  $("mDesc").textContent = imp ? "粘贴 tokens.json 内容后点「应用导入」。缺省字段用 v3 默认，超出范围的值会夹到上下限（硬下限不可突破）。" : "离线可用：全选复制即可保存（也已自动存入本机 localStorage）。";
  $("mText").value = imp ? "" : pretty(); $("mText").readOnly = !imp;
  $("mApply").style.display = imp ? "" : "none"; $("mCopy").style.display = imp ? "none" : "";
  $("mMsg").textContent = ""; $("mMsg").className = "msg"; $("modal").classList.add("on");
  setTimeout(() => { $("mText").focus(); if (!imp) $("mText").select(); }, 0);
}
$("mClose").onclick = () => $("modal").classList.remove("on");
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") $("modal").classList.remove("on"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("modal").classList.remove("on"); });
$("mCopy").onclick = async () => { const ok = await copyText($("mText").value); $("mMsg").textContent = ok ? "已复制" : "复制失败，请手动全选复制"; };
$("mApply").onclick = () => {
  let obj; try { obj = JSON.parse($("mText").value); } catch (e) { $("mMsg").textContent = "JSON 解析失败：" + e.message; $("mMsg").className = "msg err"; return; }
  if (!isObj(obj) || (!isObj(obj.themes) && !isObj(obj.size))) { $("mMsg").textContent = "缺少 themes 或 size 字段"; $("mMsg").className = "msg err"; return; }
  const { tok, notes } = normalize(obj); TOK = tok; syncSide(); onTokens(true);
  $("mMsg").className = "msg"; $("mMsg").textContent = notes.length ? `已导入（${notes.length} 处修正：${notes.slice(0, 3).join("；")}${notes.length > 3 ? "…" : ""}）` : "已导入";
};
$("bSave").onclick = () => { persist(); openModal("save"); };
$("bImport").onclick = () => openModal("import");
$("bCopy").onclick = async () => flash((await copyText(pretty())) ? "JSON 已复制到剪贴板" : "复制失败，请用「保存」弹窗手动复制");
$("bExport").onclick = () => {
  const url = URL.createObjectURL(new Blob([pretty()], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = "tokens.json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000); flash("已导出 tokens.json");
};
$("bReset").onclick = () => { if (!confirm("把所有令牌重置为 v3 默认？")) return; TOK = DEFAULTS(); syncSide(); onTokens(true); flash("已重置为 v3 默认"); };
$("bClearLog").onclick = () => { logEl.textContent = ""; };
$("bMinLog").onclick = (e) => { const w = $("logwrap"); w.classList.toggle("min"); e.target.textContent = w.classList.contains("min") ? "展开" : "收起"; };

/* ---------- 启动 ---------- */
try { const raw = localStorage.getItem(LS_KEY); if (raw) { const r = normalize(JSON.parse(raw)); TOK = r.tok; } } catch (e) { /* 忽略损坏的本机存档 */ }
buildSide(); syncSide(); applyVars(); buildCanvas();
requestAnimationFrame(() => fit(false));
window.__tuner = { get tokens() { return TOK; }, setTokens(o) { const r = normalize(o); TOK = r.tok; syncSide(); onTokens(true); return r.notes; }, boards, setZoom, fit, get zoom() { return Z; } };
})();
</script>
